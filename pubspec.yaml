name: online_booking
description: "A premium bus ticket booking application."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  http: ^1.2.0

  # Firebase
  firebase_core: ^4.10.0
  cloud_firestore: ^6.5.0
  firebase_auth: ^6.5.2
  google_sign_in: ^7.2.0

  # Notifications & Offline Alarms
  flutter_local_notifications: ^22.0.0
  timezone: ^0.11.0
  file_picker: ^13.1.0

  # State Management & DI
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3

  # Navigation
  go_router: ^18.0.2

  # Networking & API
  dio: ^5.7.0
  retrofit: ^4.4.1
  url_launcher: ^6.3.1

  # UI & UX
  google_maps_flutter: ^2.10.0
  flutter_polyline_points: ^3.1.0
  lottie: ^3.1.3
  flutter_svg: ^2.0.10+1
  google_fonts: ^9.0.0
  font_awesome_flutter: ^11.0.0
  shimmer: ^4.0.0
  animate_do: ^5.1.0
  qr_flutter: ^4.1.0
  path_provider: ^2.1.5
  screenshot: ^3.0.0
  permission_handler: ^13.0.2
  gal: ^2.3.2

  # Security & Encryption
  encrypt: ^5.0.3
  crypto: ^3.0.6
  flutter_secure_storage: ^11.2.0

  # Local Storage & Utils
  shared_preferences: ^2.3.5
  geolocator: ^14.0.2
  intl: ^0.20.2
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  flutterwave_standard: ^1.1.0
  firebase_messaging: ^16.3.0
  firebase_in_app_messaging: ^0.9.2+3
  flutter_inappwebview: ^6.1.5

dependency_overrides:
  android_file_picker:
    path: packages/android_file_picker

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^4.0.4
  freezed: ^4.0.2
  json_serializable: ^6.9.0
  retrofit_generator: ^10.2.6
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo
    - assets/icon/logo.png
    - assets/images/abc_upper.png
    - assets/images/halopesa.png
    - assets/images/mixx-by-yas.png
    - assets/images/m_pesa.png
    - assets/images/airtel-money.png
    - assets/images/Nmb_logo.jpg
    - assets/images/Logo-crdb-bank-tanzania-clipart-PNG.avif
    - assets/images/kilimanjaro.png
    - assets/images/3D_ecom.png
    - assets/images/3D_ecom.jpg
    - assets/images/katarama.jpeg
    - assets/images/buti_la_zungu.png
    - assets/images/Ester_luxury.png
    - assets/images/BM_coach.jpeg
    - assets/images/shabiby.png
    - assets/images/machame.png
    - assets/images/abood.png
    - assets/images/new_force.jpg
    - assets/images/abc_upper_class.webp
    - assets/lottie/
    - assets/vectors/
    - assets/icon/app_icon.png
    - assets/images/kilimanjaro_royal_express_bus.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/logo_launcher.png
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: '#000000'
  adaptive_icon_foreground: assets/icon/logo_launcher.png
